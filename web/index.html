<!-- 15 分钟生活圈智能体检助手 · 前端主页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15 分钟生活圈智能体检助手</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- 离线出图需把 echarts.min.js 放入 web/vendor/；加载失败自动改用 CDN -->
  <script src="/vendor/echarts.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js';document.head.appendChild(s);"></script>
</head>
<body>
  <header class="dinglan">
    <span class="biaoti">15 分钟生活圈智能体检助手</span>
    <input id="sousuo" class="sousuo" placeholder="输入社区 / 街道名称搜索" />
    <button id="sousuoBtn">搜索</button>
    <select id="shichang">
      <option value="5">步行 5 分钟</option>
      <option value="10">步行 10 分钟</option>
      <option value="15" selected>步行 15 分钟</option>
      <option value="20">步行 20 分钟</option>
    </select>
  </header>

  <main class="zhuti">
    <section class="dituhang">
      <div id="map"></div>
      <div class="caozuo">
        <div class="sheshi">
          <label><input type="checkbox" value="菜市场" checked />菜市场</label>
          <label><input type="checkbox" value="药店" checked />药店</label>
          <label><input type="checkbox" value="小学" checked />小学</label>
          <label><input type="checkbox" value="社区医院" checked />社区医院</label>
          <label><input type="checkbox" value="公园" checked />公园</label>
          <label><input type="checkbox" value="银行" checked />银行</label>
        </div>
        <div class="zuobiao">
          中心点：<input id="jingdu" placeholder="经度" /> ,
          <input id="weidu" placeholder="纬度" />
          <button id="kaishi">开始体检</button>
        </div>
        <div id="tishi" class="tishi"></div>
      </div>
    </section>

    <aside class="baogao">
      <div class="zonghe">综合得分 <span id="zonghe">--</span></div>
      <div id="pingfen" class="pingfen"></div>
      <div id="bar" class="bar"></div>
      <div class="mangqu">
        <h3>服务盲区清单</h3>
        <ul id="mangquList"></ul>
      </div>
    </aside>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/chart.js"></script>
  <script src="/js/score.js"></script>
  <script>
    // 主流程编排（拼音变量）
    let ditu = null;
    let dangqianZhongxin = null;

    async function qidong() {
      const peizhi = await huoquPeizhi();
      if (!peizhi.web_ak) {
        tishi('未配置浏览器端 AK（WEB_AK），地图底图不可用；算法与图表仍可演示。');
      } else {
        await zairuBaidu(peizhi.web_ak);
      }
      ditu = chushihuaDitu(peizhi.web_ak);
      if (ditu) {
        ditu.addEventListener('click', function (e) {
          dangqianZhongxin = e.latlng;
          document.getElementById('jingdu').value = e.latlng.lng.toFixed(6);
          document.getElementById('weidu').value = e.latlng.lat.toFixed(6);
        });
      }
    }

    function tishi(msg) {
      document.getElementById('tishi').textContent = msg;
    }

    function shoujiCanshu() {
      const sheshi = Array.from(document.querySelectorAll('.sheshi input:checked')).map(i => i.value);
      const jingdu = parseFloat(document.getElementById('jingdu').value);
      const weidu = parseFloat(document.getElementById('weidu').value);
      const shichang = parseInt(document.getElementById('shichang').value, 10);
      return { jingdu, weidu, sheshi, shichang };
    }

    document.getElementById('kaishi').addEventListener('click', async () => {
      const c = shoujiCanshu();
      if (!c.jingdu || !c.weidu) { tishi('请在地图上点选或输入中心点经纬度'); return; }
      tishi('体检中，请稍候（正在调用地图 API）...');
      const jg = await tijian(c);
      if (jg.code) { tishi(jg.msg); return; }
      huatReheat(jg.dengshiquan);
      huaBiaoji(jg.poi);
      xianshiPingfen(jg.pingfen);
      huatZhuzhuang(jg.pingfen);
      xianshiMangqu(jg.mangqu);
      tishi(jg.jiangji ? '当前为降级模式（无服务端 AK，用直线距离估算）' : '体检完成');
    });

    document.getElementById('sousuoBtn').addEventListener('click', async () => {
      const dizhi = document.getElementById('sousuo').value;
      if (!dizhi) return;
      const jg = await tijian({ dizhi, sheshi: ['菜市场'], shichang: 15 });
      if (jg.zhongxin) {
        document.getElementById('jingdu').value = jg.zhongxin.jingdu;
        document.getElementById('weidu').value = jg.zhongxin.weidu;
        dangqianZhongxin = { lat: jg.zhongxin.weidu, lng: jg.zhongxin.jingdu };
        if (ditu) ditu.setView([jg.zhongxin.weidu, jg.zhongxin.jingdu], 15);
      } else {
        tishi('地址解析失败，请确认服务端 AK 或改用经纬度');
      }
    });

    qidong();
  </script>
</body>
</html>
